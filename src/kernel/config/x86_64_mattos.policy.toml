# MattOS x86_64 generic-kernel regression contract.
#
# The full .config is derived from Ubuntu's current amd64 generic coverage and
# reconciled with the pinned MattOS kernel.  This smaller contract records the
# deliberate boundaries: bootstrap infrastructure is built in, hardware and
# installed-root filesystems are modules, and extinct buses remain absent.
minimum_module_symbols = 500

builtin = [
  "CONFIG_64BIT", "CONFIG_X86_64", "CONFIG_SMP", "CONFIG_ACPI",
  "CONFIG_EFI", "CONFIG_PCI", "CONFIG_BINFMT_ELF", "CONFIG_BLK_DEV_INITRD",
  "CONFIG_DEVTMPFS", "CONFIG_PROC_FS", "CONFIG_SYSFS", "CONFIG_TMPFS",
  "CONFIG_TTY", "CONFIG_VT", "CONFIG_SERIAL_8250_CONSOLE",
  "CONFIG_BLK_DEV_LOOP", "CONFIG_ISO9660_FS", "CONFIG_SQUASHFS",
  "CONFIG_SQUASHFS_XZ", "CONFIG_OVERLAY_FS", "CONFIG_MODULES",
  "CONFIG_MODULE_COMPRESS_ZSTD", "CONFIG_MODULE_COMPRESS_ALL",
  "CONFIG_MODULE_DECOMPRESS",
]

module = [
  "CONFIG_BLK_DEV_NVME", "CONFIG_SATA_AHCI", "CONFIG_BLK_DEV_SD",
  "CONFIG_BLK_DEV_SR", "CONFIG_SCSI_VIRTIO", "CONFIG_SCSI_MPT3SAS",
  "CONFIG_SCSI_MPI3MR", "CONFIG_SCSI_SMARTPQI", "CONFIG_USB_STORAGE",
  "CONFIG_USB_UAS", "CONFIG_MMC_BLOCK", "CONFIG_EXT4_FS",
  "CONFIG_BTRFS_FS", "CONFIG_XFS_FS", "CONFIG_F2FS_FS",
  "CONFIG_EXFAT_FS", "CONFIG_NTFS3_FS", "CONFIG_FAT_FS",
  "CONFIG_VFAT_FS", "CONFIG_FUSE_FS", "CONFIG_DRM_AMDGPU",
  "CONFIG_DRM_I915", "CONFIG_DRM_XE", "CONFIG_DRM_NOUVEAU",
  "CONFIG_DRM_VIRTIO_GPU", "CONFIG_VIRTIO_PCI", "CONFIG_VIRTIO_BLK", "CONFIG_VIRTIO_NET",
  "CONFIG_CFG80211", "CONFIG_MAC80211", "CONFIG_BT_HCIBTUSB",
  "CONFIG_HID_GENERIC", "CONFIG_USB_HID", "CONFIG_I2C_HID_ACPI",
  "CONFIG_SND_HDA_INTEL", "CONFIG_SND_USB_AUDIO", "CONFIG_USB_VIDEO_CLASS",
  "CONFIG_USB4", "CONFIG_TYPEC_UCSI", "CONFIG_UCSI_ACPI",
  "CONFIG_HYPERV_STORAGE", "CONFIG_HYPERV_NET", "CONFIG_VMWARE_PVSCSI",
]

unsupported = [
  "CONFIG_PCCARD", "CONFIG_BLK_DEV_FD", "CONFIG_PARPORT", "CONFIG_ARCNET",
  "CONFIG_FDDI", "CONFIG_ATM", "CONFIG_FIREWIRE", "CONFIG_GAMEPORT",
  "CONFIG_FB", "CONFIG_ATA_PIIX", "CONFIG_SATA_SIS", "CONFIG_SND_CMIPCI",
  "CONFIG_SND_ES1938", "CONFIG_SCSI_BUSLOGIC", "CONFIG_SCSI_ADVANSYS",
]

unsupported_prefixes = ["CONFIG_PATA_"]

set timeout=3
set default=0

# Preserve the firmware-provided framebuffer for the standalone installer.
# `all_video` selects VBE on BIOS and GOP on UEFI; keeping that mode gives the
# built-in Linux simple/EFI framebuffer drivers an authoritative screen map.
insmod all_video
set gfxmode=auto
set gfxpayload=keep

menuentry "Start MattOS Live" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init systemd.unit=mattos.target mattos.frontend=graphical loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Start MattOS Live (CLI)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init systemd.unit=mattos.target mattos.frontend=cli loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Install MattOS" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init systemd.unit=mattos-install-graphical.target mattos.frontend=graphical mattos.install=1 loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Install MattOS (CLI)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init systemd.unit=mattos-install-cli.target mattos.frontend=cli mattos.install=1 loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "MattOS Rescue" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.rescue=1 loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

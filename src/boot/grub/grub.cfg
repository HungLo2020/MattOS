set timeout=3
set default=0

# Preserve the firmware-provided display mode for the graphical live session.
insmod all_video
set gfxmode=1280x800,auto
set gfxpayload=keep

menuentry "Start MattOS Live" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.mode=live loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Start MattOS Live (CLI)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.mode=live-cli loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Install MattOS" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.mode=install-gui loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "Install MattOS (CLI)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.mode=install-cli loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "MattOS Rescue" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.rescue=1 loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

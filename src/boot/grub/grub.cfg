set timeout=3
set default=0

menuentry "MattOS (systemd)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/usr/lib/systemd/systemd systemd.unit=mattos.target initramfs_options=size=75% loglevel=7
    initrd /boot/initramfs.cpio.gz
}

menuentry "MattOS (rescue init)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/usr/libexec/mattos/rescue-init initramfs_options=size=75% loglevel=7
    initrd /boot/initramfs.cpio.gz
}

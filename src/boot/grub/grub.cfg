set timeout=3
set default=0

menuentry "MattOS (systemd)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init systemd.unit=mattos.target loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

menuentry "MattOS (rescue init)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init mattos.rescue=1 loglevel=7
    initrd /boot/early-initramfs.cpio.xz
}

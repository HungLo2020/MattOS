[package]
name = "mattos-build"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
filetime = "0.2"

[dev-dependencies]
tempfile = "3.12"

---
# MattOS-owned Calamares configuration. Upstream Calamares is intentionally
# kept pristine under upstream/; this directory is the distro integration.
# Keep the standard Calamares "local" lookup, but name MattOS's Debian
# multiarch plugin directory explicitly as well. The explicit entry makes
# module discovery deterministic when the launcher is started from a desktop
# session whose compiled-in systemLibDir differs from the target layout.
modules-search:
- local
- /usr/lib/x86_64-linux-gnu/calamares/modules
branding: mattos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
instances:
- id: profile
  module: packagechooser
  config: mattos-profile.conf
- id: mattos-executor
  module: shellprocess
  config: mattos-executor.conf
- id: mattos-finalize
  module: shellprocess
  config: mattos-finalize.conf
sequence:
- show: [ welcome, locale, keyboard, partition, users, packagechooser@profile, summary ]
# MattOS's finalizer writes the profile-aware fstab (including Btrfs @,
# @home, and @snapshots).  Do not run Calamares' generic fstab module after
# it, since that would replace the subvolume-aware entries and make the
# installed initramfs mount the Btrfs top-level repeatedly.
- exec: [ partition, mount, shellprocess@mattos-executor, users, locale, keyboard, shellprocess@mattos-finalize, umount ]
- show: [ finished ]

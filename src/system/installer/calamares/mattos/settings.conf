---
# MattOS-owned Calamares configuration. Upstream Calamares is intentionally
# kept pristine under upstream/; this directory is the distro integration.
modules-search: [ local ]
branding: mattos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec: [ partition, mount, mattos-executor, fstab, umount ]
- show: [ finished ]

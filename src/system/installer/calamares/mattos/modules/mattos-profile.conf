# Select exactly one MattOS target profile. The selected id is stored in
# GlobalStorage as packagechooser_profile and consumed by the Rust adapter.
---
mode: required
method: legacy
# Default to the CLI target; the user may explicitly choose Plasma.
default: cli
labels:
    step: "MattOS target profile"
items:
    - id: cli
      name: "MattOS CLI"
      description: "A text-first system with no Plasma desktop closure."
      screenshot: ":/images/no-selection.png"
    - id: plasma
      name: "MattOS Plasma"
      description: "A complete Plasma Wayland desktop installation."
      screenshot: ":/images/kde.png"

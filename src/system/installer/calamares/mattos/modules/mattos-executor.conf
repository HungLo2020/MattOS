---
# The first Calamares phase owns presentation and storage orchestration. The
# existing source-owned Rust installer remains the sole authority for target
# composition, package profiles, fstab finalization and bootloader policy.
# This process module is deliberately temporary until that narrow Rust API is
# exposed as a native Calamares job plugin.
dontChroot: true
timeout: 0
verbose: true
script: /usr/libexec/mattos/calamares-target-executor --phase compose --profile ${gs[packagechooser_profile]} --target ${ROOT}

---
# MattOS account policy for the upstream Calamares users module.
defaultGroups:
    - video
    - render
    - sudo
sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: true
displayAutologin: false
doAutologin: false
passwordRequirements:
    minLength: 1
user:
    shell: /bin/brush

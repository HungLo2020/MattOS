d /home/mattos 0750 1000 1000 -
# The pre-created live account does not pass through useradd's /etc/skel
# ownership handling.  Flatpak's user repository lives below this path, so
# create every parent as the live user before the graphical session starts.
d /home/mattos/.local 0755 1000 1000 -
d /home/mattos/.local/share 0755 1000 1000 -
d /home/mattos/.local/share/flatpak 0755 1000 1000 -
d /home/mattos/.local/share/flatpak/overrides 0755 1000 1000 -
d /run/mattos-live 0755 - - -

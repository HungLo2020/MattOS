# Debian revisions of MattOS packages.
#
# A MattOS package's version is <upstream>-1mattos<revision>.  A package whose
# bytes change while its upstream version does not (a packaging fix, a
# dependency's new exact version) needs a higher revision, or installed
# systems never upgrade to it.  DevUtils/PublishPackages.py maintains this
# file: it never uploads different bytes under a version that is already
# published, and instead raises the revision here, rebuilds and publishes the
# new version.  Commit this file with the packages it describes.
#
# An entry applies only while `upstream` is the package's current upstream
# version (including any epoch); a new upstream version starts again at
# revision 1, and the stale entry is then ignored.
schema_version = 1

[package]
"appstream" = { upstream = "1.1.6", revision = 3 }

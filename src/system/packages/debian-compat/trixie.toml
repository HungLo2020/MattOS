schema_version = 1
suite = "trixie"
architecture = "amd64"
policy = "Best-effort Debian 13 binary compatibility with a MattOS-built protected base"
version_policy = "<upstream>-1mattos<N>; snapshots use 0~git.<commit>-1mattos<N>; no timestamps"

[[package]]
debian_name = "mattos-filesystem"
mattos_name = "mattos-filesystem"
source_component = "MattOS"
owned_paths = ["/bin -> usr/bin"]
provided_abi_or_commands = ["filesystem hierarchy"]
protected = true
current_mattos_version = "0.1-1mattos1"
expected_debian_role = "MattOS filesystem owner"
classification = "mattos-specific"
known_gaps = ["No Debian package identity claimed"]


schema_version = 1
suite = "trixie"

# These names are reserved even when the matching Debian package contract is
# still recorded as a gap. This prevents a supplemental repository from
# silently taking ownership of critical files already supplied by MattOS.
packages = [
  "apt", "binutils", "coreutils", "cpp", "dpkg", "g++", "gcc",
  "libapt-pkg7.0", "libc-bin", "libc6", "libc6-dev", "libgcc-14-dev",
  "libgcc-s1", "libpam-modules", "libpam-runtime", "libpam0g",
  "libssl3t64", "libstdc++-14-dev", "libstdc++6", "libsystemd0",
  "libudev1", "linux-headers-amd64", "linux-image-amd64", "linux-libc-dev",
  "login", "make", "mattos-base-files", "mattos-brush", "mattos-libgcc-dev",
  "mattos-filesystem", "mattos-libcrypto3", "mattos-libstdc++-dev", "mattos-sudo-rs", "mount",
  "passwd", "systemd", "udev", "util-linux", "gzip", "bzip2", "xz-utils", "zstd",
  "patch", "file", "libmagic1", "less", "git", "openssh-client", "openssh-server",
  "libuuid1", "libfdisk1",
]

# Environment for the source-owned Plasma Wayland session.
#
# Keep this separate from the COSMIC fallback environment. In particular, do
# not force QT_QPA_PLATFORM here: start-plasma-wayland is the compositor's
# session launcher and KWin must initialize before client applications choose
# a QPA backend.
XDG_CURRENT_DESKTOP=KDE
XDG_SESSION_DESKTOP=KDE
XDG_SESSION_TYPE=wayland
KDE_FULL_SESSION=true
GDK_BACKEND=wayland
MOZ_ENABLE_WAYLAND=1
QT_PLUGIN_PATH=/usr/plugins:/usr/lib/x86_64-linux-gnu/plugins
QT_QPA_PLATFORM_PLUGIN_PATH=/usr/plugins/platforms:/usr/lib/x86_64-linux-gnu/plugins/platforms
QML2_IMPORT_PATH=/usr/lib/x86_64-linux-gnu/qml:/usr/lib/qt6/qml
XDG_DATA_DIRS=/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
XCURSOR_THEME=Breeze
XCURSOR_SIZE=24

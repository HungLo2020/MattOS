action = "exclude"
reason = "MattOS stages the checksum-verified official patch-2.8 release archive in an output-owned mirror; that release contains the generated Gnulib closure required to build patch, so the development-only Git submodule is neither an authoritative vendored-tree member nor a runtime input."

[[component]]
name = "git"
upstream_commit = "e9019fcafe0040228b8631c30f97ae1adb61bcdc"

[[component.gitlink]]
path = "sha1collisiondetection"
upstream_commit = "855827c583bc30645ba427885caa40c5b81764d2"
action = "exclude"
reason = "Git's DC_SHA1_SUBMODULE path is experimental and is not enabled by MattOS; the pinned Git tree's ordinary sha1dc sources provide the default collision-detecting SHA-1 implementation used by this build."

[[component]]
name = "tar"
upstream_commit = "e545d446dfe6564265cdf4186641ee76f4acc7fa"

[[component.gitlink]]
path = "gnulib"
upstream_commit = "46f9c21a08245fe224fd975de8632b04a0256387"
action = "replacement"
replacement_component = "gnulib"
replacement_path = "src/build-support/gnulib"
replacement_commit = "20932856a6a07f056918d58acd09cea4ba150a52"
exact_gitlink_match = false
reason = "MattOS deliberately uses its single immutable stable-202301 Gnulib import for output-owned Tar bootstrap generation; Tar's formal output-only patch manifest backports the gitlink-era FLEXNSIZEOF compatibility macro, and neither authoritative vendored tree is changed."

[[component.gitlink]]
path = "paxutils"
upstream_commit = "481bae11050fcbdca67a66eb57390267b280a312"
action = "replacement"

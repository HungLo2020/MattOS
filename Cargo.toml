[workspace]
members = [
    "src/tools/mattos-build",
    "src/system/installer",
    "src/userland/init",
    "src/system/compat/mattos-compat"
]
exclude = [
    "src/userland/grep",
    "src/userland/sed",
    "src/userland/findutils",
    "src/userland/diffutils",
    "src/system/auth/sudo-rs"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["MattOS Contributors"]
repository = "https://github.com/HungLo2020/MattOS"

# mattos-build does substantial in-process work (hashing, payload scans,
# packaging, ELF inspection); unoptimized it dominates the build's tail.
[profile.dev.package.mattos-build]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

site_name: MattOS Wiki
site_description: Version-controlled MattOS wiki and project documentation
site_url: https://hunglo2020.github.io/MattOS/
repo_url: https://github.com/HungLo2020/MattOS
repo_name: HungLo2020/MattOS
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - assets/javascripts/random-page.js

# No explicit nav: navigation follows the docs/ directory hierarchy, with
# each directory's index.md as its section page (navigation.indexes).  The
# hierarchy is enforced by DevUtils/check_wiki_structure.py.
